name = "busybeaver"
version = "0.1.0"
defaultTargets = ["beaver"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.32.0"

[[require]]
name = "Cli"
git = "https://github.com/leanprover/lean4-cli"
rev = "v4.32.0"

[[require]]
name = "checkdecls"
git = "https://github.com/PatrickMassot/checkdecls.git"

[[require]]
name = "leansqlite"
git = "https://github.com/leanprover/leansqlite"
rev = "v4.31.0"

[[require]]
name = "lean-tqdm"
git = "https://github.com/mfornet/lean-tqdm"
rev = "main"

[[lean_lib]]
name = "Busybeaver"

[[lean_lib]]
name = "Witness"

# Gated value theorems (BB(2,2) … BB(5,2)): NOT in defaultTargets, so plain
# `lake build` skips them. Build explicitly with `lake build BBTheorems`
# (or a single module, e.g. `lake build BBTheorems.BB4`). BB5 takes hours.
[[lean_lib]]
name = "BBTheorems"

[[lean_exe]]
name = "beaver"
root = "Main"

[[lean_exe]]
name = "beaverKernel"
root = "MainKernel"

# Two interchangeable Skelet #1 proof backends. The fast target uses compiled
# native evaluation; the kernel target imports the resumable checkpoint proof.
[[lean_lib]]
name = "Skelet1Fast"

[[lean_lib]]
name = "Skelet1Kernel"

# Untrusted profiling tool for sizing the Skelet #1 chunked certificate.
[[lean_exe]]
name = "skelet1prof"
root = "Skelet1Prof"

# Skelet #1's generated, kernel-checked checkpoint certificate. Its large
# modules are deliberately untracked; `scripts/verify_skelet1.sh 12` generates
# them deterministically, then performs a resumable, memory-bounded check.
[[lean_lib]]
name = "Skelet1Cert"
globs = ["Skelet1Cert.+"]
